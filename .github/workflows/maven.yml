name: Project CI

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Validate project structure
      run: |
        test -f build.xml
        test -f nbproject/build-impl.xml
        test -f web/WEB-INF/web.xml
        python -c "import xml.etree.ElementTree as ET; ET.parse('build.xml'); ET.parse('nbproject/build-impl.xml'); ET.parse('web/WEB-INF/web.xml')"
